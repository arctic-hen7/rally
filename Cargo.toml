[package]
name = "rally-teams"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "rally"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "string"] }
cron = "0.15"
hex = "0.4"
jsonwebtoken = { version = "9", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "limit"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
model2vec-rs = { version = "0.4", default-features = false, features = ["local-only", "fancy-regex"] }
web-push = { version = "0.11", default-features = false, features = ["isahc-client"] }
