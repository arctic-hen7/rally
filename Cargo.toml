[workspace]
members = ["src/server"]
default-members = [".", "src/server"]
resolver = "3"

[workspace.package]
# Release builds take their version from the pushed Git tag
version = "0.0.0-dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arctic-hen7/rally"

[package]
name = "rally-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line client for Rally's self-hosted missions, agents and conversations"
categories = ["command-line-utilities"]
readme = "docs/cli.md"
include = ["src/client/**", "src/bin/rally.rs", "src/lib.rs", "docs/cli.md", "LICENSE-*"]
default-run = "rally"

[lib]
name = "rally_teams"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = "4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
url = "2"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["string"] }
hex = "0.4"
rand.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }
